/* ===== depth layer: one shared feel for every tab ===== */
.glass,.tile,.sq,.rbox,.scard,.rcentre{--mx:50%;--my:0%}
.glass{background:linear-gradient(165deg,rgba(255,255,255,.92),rgba(255,255,255,.66) 60%,rgba(247,242,252,.7));
  border:1px solid rgba(255,255,255,.85);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(75,52,112,.06),0 1px 2px rgba(75,52,112,.06),0 14px 34px -18px rgba(75,52,112,.32),0 2px 0 rgba(75,52,112,.03);
  position:relative;isolation:isolate}
.glass:not(.co):not(.guest)::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .35s;
  background:radial-gradient(420px circle at var(--mx) var(--my),rgba(123,94,167,.13),transparent 45%)}
.glass:not(.co):not(.guest):hover::before{opacity:1}
.glass:not(.pitem):not(.memenu)::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(123,94,167,.18) 40%,rgba(47,125,98,.12) 75%,rgba(255,255,255,.6));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.tilt{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;transform-style:preserve-3d;will-change:transform}
.tilt:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 4px rgba(75,52,112,.06),0 30px 60px -28px rgba(75,52,112,.45)}

/* headings with light */
section .bar h2{position:relative}
section .bar h2 em,h1 em{background:linear-gradient(100deg,#9B7BD0,var(--bloom) 40%,#C2557A 95%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
section .bar>div:first-child{position:relative}
section .bar>div:first-child::before{content:"";position:absolute;width:340px;height:220px;left:-60px;top:-50px;z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,rgba(217,200,242,.55),transparent);filter:blur(8px)}
.kicker::before{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,currentColor);box-shadow:0 0 10px currentColor}

/* numbers that feel carved */
.fact b,.tile .v,.sring b{background:linear-gradient(180deg,#9B7BD0,var(--bloom-d));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(255,255,255,.9)) drop-shadow(0 6px 10px rgba(75,52,112,.18))}
.tile.mine .v{background:none;color:var(--ink);filter:none}

/* glossy, pressable buttons */
.play{background:linear-gradient(180deg,#9A7BD1,var(--bloom) 45%,var(--bloom-d))!important;color:#fff;border:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.12),0 10px 22px -10px rgba(75,52,112,.7),0 2px 0 #3A2860;
  transition:transform .15s,box-shadow .15s,filter .2s}
.play:hover{filter:brightness(1.06);transform:translateY(-1px)}
.play:active{transform:translateY(1px);box-shadow:inset 0 2px 6px rgba(0,0,0,.25),0 4px 10px -8px rgba(75,52,112,.7),0 0 0 #3A2860}
.ghost,.chip,.pchip{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(75,52,112,.08),0 6px 14px -10px rgba(75,52,112,.35);transition:transform .2s cubic-bezier(.3,1.4,.5,1),box-shadow .2s}
.ghost:hover,.chip:hover,.pchip:hover{transform:translateY(-2px)}
.av{box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -2px 3px rgba(0,0,0,.18),0 4px 10px -4px var(--c)}
.av{background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 70%,#000))}

/* tabs: floating pill bar and soft page entrance */
.nav button[aria-selected="true"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 18px -10px rgba(75,52,112,.5)}
.tabpanel.enter>section{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.tabpanel.enter>section:nth-child(2){animation-delay:.08s}.tabpanel.enter>section:nth-child(3){animation-delay:.16s}.tabpanel.enter>section:nth-child(4){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* background moves a little with you */
.orb{translate:calc(var(--px,0) * 30px) calc(var(--py,0) * 24px);transition:translate 1.2s cubic-bezier(.2,.8,.2,1)}
.o2{translate:calc(var(--px,0) * -26px) calc(var(--py,0) * -20px)}
.orb.o4{width:300px;height:300px;background:#F3C9DA;top:18%;right:-90px;opacity:.45;animation-duration:44s}

@media (prefers-reduced-motion: reduce){.tilt{transform:none!important}.tabpanel.enter>section{animation:none}.orb{transition:none}}
@media (hover:none){.tilt{transform:none!important}}

/* ================= Vision home ================= */
.vhero{padding-top:34px}
.vhero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.vhero h1{font-size:clamp(38px,5.4vw,64px)}
.vpath{display:flex;align-items:center;gap:8px;margin-top:22px;flex-wrap:wrap}
.vpath .vp{display:flex;flex-direction:column;padding:10px 14px;border-radius:16px;background:var(--glass2);border:1px solid var(--line);font-size:13px;color:var(--muted);min-width:118px}
.vpath .vp b{font:500 20px var(--serif);color:var(--ink)}
.vpath .vp.now{background:linear-gradient(150deg,var(--leaf-s),#fff);border-color:rgba(47,125,98,.35)}
.vpath .vp.now b{color:var(--leaf)}
.vpath>i{flex:1;min-width:16px;height:2px;background:linear-gradient(90deg,var(--leaf),var(--bloom));border-radius:2px;opacity:.5}
.hstage{height:470px;perspective:1300px;position:relative;cursor:pointer}
.hstack{--rx:18deg;--ry:-10deg;position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.hl{position:absolute;left:12%;right:12%;height:150px;border-radius:30px;border:1px solid rgba(255,255,255,.7);text-align:left;padding:22px 26px;color:#fff;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s;font-family:var(--sans);overflow:hidden}
.hl::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.45),transparent 40%);pointer-events:none}
.hl .hk{display:block;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hl b{display:block;font:500 27px/1.1 var(--serif);margin-top:4px}
.hl small{display:block;font-size:13.5px;opacity:.9;margin-top:6px}
.hl>i,.hl>svg{position:absolute;right:22px;top:22px;width:54px;height:54px;opacity:.9;stroke-width:1.4}
.hl.l1{top:300px;background:linear-gradient(135deg,#3C9A78,#1F5E48);transform:translateZ(0) translateX(24px);box-shadow:0 40px 60px -20px rgba(31,94,72,.6)}
.hl.l2{top:160px;background:linear-gradient(135deg,#8E6BC4,#4B3470);transform:translateZ(40px);box-shadow:0 50px 70px -24px rgba(75,52,112,.6)}
.hl.l3{top:20px;background:linear-gradient(135deg,#E08AA8,#B0476C 60%,#C98A2B);transform:translateZ(80px) translateX(-24px);box-shadow:0 60px 80px -24px rgba(176,71,108,.55)}
.hl.l1:hover{transform:translateZ(30px) translateX(24px)}.hl.l2:hover{transform:translateZ(70px)}.hl.l3:hover{transform:translateZ(110px) translateX(-24px)}.hl:focus{outline:none}.hl:focus-visible{outline:3px solid var(--bloom);outline-offset:3px}
.beams{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.beams span{position:absolute;bottom:60px;width:3px;height:300px;border-radius:3px;background:linear-gradient(to top,rgba(255,255,255,0),rgba(255,255,255,.95),rgba(255,255,255,0));transform-origin:bottom;transform:translateZ(20px);animation:beam 3.2s ease-in-out infinite;opacity:.0}
.beams span:nth-child(1){left:20%}.beams span:nth-child(2){left:34%;animation-delay:.5s}.beams span:nth-child(3){left:48%;animation-delay:1s}.beams span:nth-child(4){left:62%;animation-delay:1.5s}.beams span:nth-child(5){left:76%;animation-delay:2s}.beams span:nth-child(6){left:84%;animation-delay:2.6s}
@keyframes beam{0%,100%{opacity:0;transform:translateZ(20px) translateY(0)}40%{opacity:.7}70%{opacity:0;transform:translateZ(20px) translateY(-40px)}}
.weekstrip{margin-top:4px}

/* content engine */
.eng{padding:22px;margin-top:26px;position:relative}
.esteps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.esteps i{height:5px;border-radius:5px;background:var(--paper2);overflow:hidden;position:relative}
.esteps i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bloom),var(--rose));transform:scaleX(0);transform-origin:left;transition:transform .6s}
.esteps i.on::after{transform:scaleX(1)}
.ecols{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;position:relative}
.ecol{position:relative;z-index:1;padding:14px;border-radius:18px;background:rgba(255,255,255,.6);border:1px solid var(--line);opacity:.45;filter:saturate(.4);transform:translateY(8px);transition:all .6s cubic-bezier(.2,.7,.2,1);min-height:250px;display:flex;flex-direction:column;gap:10px}
.ecol.on{opacity:1;filter:none;transform:none}
.ecol.cur{box-shadow:0 0 0 2px var(--bloom),0 24px 40px -18px rgba(75,52,112,.5);background:#fff}
.ek{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--bloom-d)}
.ecap,.ecol small{font-size:12.5px;color:var(--muted);line-height:1.4}
.eflow{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.efp{fill:none;stroke:var(--line2);stroke-width:2;stroke-dasharray:4 5}
.efd{fill:var(--rose);opacity:0;transition:opacity .4s}
.eng[data-s="1"] .efd[data-i="0"],.eng[data-s="2"] .efd[data-i="0"],.eng[data-s="2"] .efd[data-i="1"],.eng[data-s="3"] .efd[data-i="0"],.eng[data-s="3"] .efd[data-i="1"],.eng[data-s="3"] .efd[data-i="2"],.eng[data-s="4"] .efd,.eng.done .efd{opacity:.9}
.cam{border-radius:16px;background:linear-gradient(160deg,#2A2238,#3E3152);color:#fff;padding:12px;display:flex;flex-direction:column;gap:10px}
.cam small{color:rgba(255,255,255,.75)}
.camtop{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em}
.camtop b{margin-left:auto;font-variant-numeric:tabular-nums}
.recdot{width:9px;height:9px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 0 rgba(229,72,77,.6)}
.eng .ecol.on .recdot{animation:ping 1.4s infinite}
.duo2{display:flex;align-items:center;justify-content:center;gap:10px}
.duo2 .av{width:38px;height:38px;font-size:15px;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.mic2{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.mic2 svg{width:18px;height:18px}
.wave{display:flex;align-items:center;gap:2px;height:34px}
.wave i{flex:1;background:linear-gradient(to top,var(--rose),#B79AE0);border-radius:2px;height:20%;transition:height .3s}
.ecol.on .wave i{animation:wv 1s ease-in-out infinite}
.wave i:nth-child(3n){animation-delay:-.3s!important}.wave i:nth-child(3n+1){animation-delay:-.6s!important}.wave i:nth-child(4n){animation-duration:.8s!important}.wave i:nth-child(5n){animation-duration:1.3s!important}
@keyframes wv{0%,100%{height:15%}50%{height:95%}}
.clips{display:flex;flex-wrap:wrap;gap:5px}
.clip{font-size:11px;font-weight:700;padding:5px 8px;border-radius:9px;background:var(--bloom-s);color:var(--bloom-d);opacity:0;transform:scale(.6) translateY(10px);transition:all .45s cubic-bezier(.3,1.5,.5,1);transition-delay:calc(var(--i)*90ms)}
.ecol.on .clip{opacity:1;transform:none}
.clip:nth-child(3n){background:var(--rose-s);color:var(--rose)}.clip:nth-child(4n){background:var(--leaf-s);color:var(--leaf)}
.ehdls{display:flex;flex-direction:column;gap:7px}
.hdl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);font-size:12.5px;font-weight:700;opacity:0;transform:translateX(-12px);transition:all .5s;transition-delay:calc(var(--i)*140ms)}
.hdl svg{width:16px;height:16px;color:var(--c);flex:none}
.hdl b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--c)}
.ecol.on .hdl{opacity:1;transform:none}
.funnel{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:150px}
.fdrops{position:absolute;inset:0 0 70px}
.fdrops i{position:absolute;top:0;width:9px;height:9px;border-radius:50%;background:var(--bloom);opacity:0}
.fdrops i:nth-child(1){left:10%}.fdrops i:nth-child(2){left:24%}.fdrops i:nth-child(3){left:38%}.fdrops i:nth-child(4){left:52%}.fdrops i:nth-child(5){left:66%}.fdrops i:nth-child(6){left:80%}.fdrops i:nth-child(7){left:30%}.fdrops i:nth-child(8){left:60%}
.ecol.on .fdrops i{animation:drop 1.8s ease-in infinite}
.fdrops i:nth-child(2n){animation-delay:.4s!important;background:var(--rose)}.fdrops i:nth-child(3n){animation-delay:.9s!important;background:var(--leaf)}.fdrops i:nth-child(4n){animation-delay:1.3s!important}
@keyframes drop{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(calc(50% - var(--x,0px)),80px) scale(.5)}}
.fbowl{width:100%;border-radius:18px 18px 22px 22px;background:linear-gradient(160deg,var(--bloom),var(--bloom-d));color:#fff;padding:12px;text-align:center;box-shadow:0 18px 30px -14px rgba(75,52,112,.7)}
.fbowl svg{width:22px;height:22px}
.fbowl b{display:block;font:500 30px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.fbowl small{color:rgba(255,255,255,.85)!important}
.streams{display:flex;flex-direction:column;gap:7px}
.stm{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:8px 10px;border-radius:12px;background:linear-gradient(120deg,var(--sun-s),#fff);border:1px solid rgba(201,138,43,.25);opacity:0;transform:translateY(10px);transition:all .5s;transition-delay:calc(var(--i)*160ms)}
.stm svg{width:16px;height:16px;color:var(--sun);flex:none}
.stm:last-child{background:linear-gradient(120deg,var(--leaf-s),#fff);border-color:rgba(47,125,98,.3)}.stm:last-child svg{color:var(--leaf)}
.ecol.on .stm{opacity:1;transform:none}
.ecaption{margin-top:16px;text-align:center;font:400 18px var(--serif);color:var(--ink);min-height:1.5em}

/* calculators */
.calc{padding:24px;margin-top:22px}
.calch{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.calch h3{font:500 24px var(--serif)}
.chip[aria-pressed="true"]{background:var(--bloom-d);color:#fff;border-color:var(--bloom-d)}
.cgrid{display:grid;grid-template-columns:1fr 1.1fr;gap:26px;margin-top:20px;align-items:stretch}
.csl{display:flex;flex-direction:column;gap:16px}
.csl label{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13.5px;color:var(--muted);font-weight:600}
.csl label b{font:500 18px var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.csl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--bloom-d);height:22px}
.cout{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:20px;background:linear-gradient(160deg,#fff,var(--bloom-s));border:1px solid var(--line)}
.cbars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;height:170px;align-items:end}
.cbar2{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--muted);font-weight:700}
.cb{width:100%;height:var(--h);border-radius:12px 12px 6px 6px;background:linear-gradient(to top,var(--bloom-d),var(--bloom) 60%,#C9B3EA);position:relative;transition:height .6s cubic-bezier(.3,1.3,.5,1);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 12px 24px -12px rgba(75,52,112,.6);min-height:4px}
.cb b{position:absolute;top:-22px;left:0;right:0;text-align:center;color:var(--ink);font-size:12.5px;white-space:nowrap}
.cbig span{font-size:13px;color:var(--muted);font-weight:700}
.cbig b{display:block;font:500 clamp(34px,5vw,48px)/1.1 var(--serif);background:linear-gradient(120deg,var(--bloom-d),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.cbig small{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}

/* growth agency */
.agy{padding:22px;margin-top:26px;display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.clinic{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--sh1)}
.clinic .cbar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--paper2);font-size:12px;font-weight:700;color:var(--muted)}
.clinic .cbar i{width:9px;height:9px;border-radius:50%;background:#E5484D}.clinic .cbar i:nth-child(2){background:#E8A33B}.clinic .cbar i:nth-child(3){background:#3FB27F}
.clinic .cbar span{margin-left:8px}
.cgridx{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.cw{position:relative;padding:12px 12px 12px 46px;border-radius:14px;border:1px dashed var(--line2);background:var(--paper);transition:all .6s cubic-bezier(.2,.7,.2,1);min-height:86px}
.cw:last-child{grid-column:1/-1}
.cw>svg{position:absolute;left:12px;top:13px;width:22px;height:22px;color:var(--faint);transition:color .5s}
.cw b{display:block;font-size:13.5px}
.cw span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.cw .now{display:none}
.cw.fixed{border-style:solid;border-color:rgba(47,125,98,.35);background:linear-gradient(150deg,var(--leaf-s),#fff 70%)}
.cw.fixed>svg{color:var(--leaf)}
.cw.fixed .was{display:none}.cw.fixed .now{display:block;color:var(--ink);animation:rise .5s both}
.cw.cur{box-shadow:0 0 0 2px var(--leaf),0 18px 30px -16px rgba(47,125,98,.6);transform:translateY(-2px)}
.meters{display:flex;flex-direction:column;gap:10px}
.meters .meter{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline;font-size:13px;color:var(--muted);font-weight:700;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.meters .meter b{font:500 24px var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.mbar{grid-column:1/-1;height:7px;border-radius:7px;background:var(--paper2);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--leaf),#6CC4A1);transition:width .8s cubic-bezier(.3,.9,.3,1)}
.meters .meter:first-child .mbar i{background:linear-gradient(90deg,var(--rose),#E9A0B8)}
.ups{display:flex;flex-direction:column;gap:6px;margin:14px 0 8px}
.up{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-size:13px;opacity:.45;transition:all .4s}
.up.on{opacity:1}.up.cur{background:var(--leaf-s)}
.up .un{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--paper2);color:var(--muted);flex:none}
.up.on .un{background:var(--leaf);color:#fff}
.up .uw{margin-left:auto;display:flex}.up .uw .av{width:24px;height:24px;font-size:10px;margin-left:-5px;box-shadow:0 0 0 2px #fff}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;position:relative}
.rung{position:relative;padding:20px 18px 18px;border-radius:20px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh1)}
.rung:nth-child(2){transform:translateY(-14px)}.rung:nth-child(3){transform:translateY(-28px);background:linear-gradient(160deg,var(--sun-s),#fff)}
.rung .rn{position:absolute;top:-14px;left:18px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--leaf),#1F5E48);box-shadow:0 8px 16px -6px rgba(31,94,72,.6)}
.rung:nth-child(3) .rn{background:linear-gradient(135deg,var(--sun),#A86E18)}
.rung b{display:block;font:500 20px var(--serif);margin-top:4px}
.rung p{font-size:13.5px;color:var(--muted);margin-top:6px}
.sviz{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.sv{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.sv span{grid-row:1;grid-column:1}
.sv .bars2{grid-column:2;display:flex;height:22px;border-radius:8px;background:var(--paper2);overflow:hidden}
.sv .bars2 i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#8E6BC4,var(--bloom-d));transition:width .6s cubic-bezier(.3,.9,.3,1)}
.sv .bars2 i.add{background:linear-gradient(90deg,var(--leaf),#6CC4A1)}
.sv.us .bars2 i{background:linear-gradient(90deg,var(--sun),#E8B460)}

/* roots */
.roots{position:relative;overflow:hidden;padding:46px 34px;text-align:center;background:linear-gradient(160deg,#fff,var(--rose-s) 60%,var(--sun-s))}
.roots .lede{margin:12px auto 0;max-width:560px}
.rglow{position:absolute;left:50%;top:100%;width:680px;height:680px;margin-left:-340px;margin-top:-180px;border-radius:50%;background:radial-gradient(circle,rgba(201,138,43,.35),rgba(194,85,122,.15) 40%,transparent 70%);animation:efloat 6s ease-in-out infinite;pointer-events:none}
.roots>div:last-child{position:relative}

/* ================= First win: prospects ================= */
#firstwin .pwrap{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;margin-top:26px;align-items:start}
.pmap{padding:18px;position:sticky;top:90px}
.pmap svg{width:100%;height:auto;display:block;overflow:visible}
.pmap .ax{stroke:var(--line2);stroke-width:1}
.pmap .axl{font:700 11px var(--sans);fill:var(--faint);letter-spacing:.06em}
.pmap .zone{fill:url(#pzone)}
.pdot{cursor:pointer;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.pdot circle.b{stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 6px 10px rgba(75,52,112,.35));transition:r .5s}
.pdot circle.h{fill:none;stroke-width:2;opacity:0;transition:opacity .3s}
.pdot.on circle.h,.pdot:hover circle.h{opacity:1}
.pdot text{font:800 11px var(--sans);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pdot .lb{font:700 10.5px var(--sans);fill:var(--ink);text-anchor:middle}
.pmapkey{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:8px}
.pmapkey i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.wts{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-bottom:14px}
.wts label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px;font-weight:700;color:var(--muted)}
.wts label b{color:var(--ink);font-size:12px}
.wts input{grid-column:1/-1;width:100%;accent-color:var(--bloom-d)}
.wts .chips{grid-column:1/-1}
.plist{display:flex;flex-direction:column;gap:10px;position:relative}
.pc{padding:12px 14px;display:block;width:100%;text-align:left;font-family:var(--sans);color:var(--ink);cursor:pointer;transition:box-shadow .3s,background .3s}
.pc.on{box-shadow:0 0 0 2px var(--bloom),var(--sh2);background:#fff}
.pc .ph{display:flex;align-items:center;gap:12px}
.pc .rk{font:500 26px/1 var(--serif);color:var(--faint);width:28px;text-align:center;flex:none}
.pc:nth-child(1) .rk{color:var(--sun)}.pc:nth-child(2) .rk,.pc:nth-child(3) .rk{color:var(--bloom)}
.pc .pi{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 8px 16px -8px var(--c)}
.pc .pi svg{width:20px;height:20px}
.pc .pn{flex:1;min-width:0}
.pc .pn b{display:block;font-size:15px}
.pc .pn span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .sc{position:relative;width:46px;height:46px;flex:none}
.pc .sc svg{width:46px;height:46px;transform:rotate(-90deg)}
.pc .sc circle{fill:none;stroke-width:5}
.pc .sc .bg{stroke:var(--paper2)}
.pc .sc .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.3,.9,.3,1)}
.pc .sc b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}
.pc .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.pc .mini span{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.pc .mini i{display:block;height:5px;border-radius:5px;background:var(--paper2);margin-top:3px;overflow:hidden}
.pc .mini i::after{content:"";display:block;height:100%;width:calc(var(--v)*20%);background:var(--c);border-radius:5px}
.pc .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.7,.2,1)}
.pc.on .more{grid-template-rows:1fr}
.pc .more>div{overflow:hidden}
.pc .pd{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pc .pd div{padding:10px;border-radius:12px;background:var(--paper);font-size:13px;line-height:1.45}
.pc .pd div.w{grid-column:1/-1}
.pc .pd em{display:block;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.pc .pf{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pc .pf .av{width:26px;height:26px;font-size:11px}
.pc .tag{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--bloom-s);color:var(--bloom-d)}
.pc .tag.safe{background:var(--leaf-s);color:var(--leaf)}
.pc .tag.lean{background:var(--sun-s);color:#9A6618}

@media (max-width:900px){
  .vhero .wrap,.agy,.cgrid,#firstwin .pwrap{grid-template-columns:1fr}
  .hstage{height:400px}
  .hl{left:6%;right:6%;height:130px;padding:18px 20px}.hl b{font-size:23px}
  .hl.l1{top:262px}.hl.l2{top:140px}.hl.l3{top:18px}
  .ecols{grid-template-columns:1fr 1fr;gap:12px}
  .ecol{min-height:0}
  .ecol:last-of-type{grid-column:1/-1}
  .pmap{position:relative;top:0}
}
@media (max-width:560px){
  .ecols{grid-template-columns:1fr}
  .cgridx{grid-template-columns:1fr}
  .ladder{grid-template-columns:1fr}.rung:nth-child(n){transform:none}
  .wts{grid-template-columns:1fr}
  .pc .pd{grid-template-columns:1fr}
  .vpath .vp{min-width:0;flex:1}
  .hl>i,.hl>svg{width:40px;height:40px}
  .vpath{gap:6px}.vpath>i{display:none}.vpath .vp{padding:8px 10px;font-size:12px}.vpath .vp b{font-size:17px}
  .hstage{margin-top:26px;height:380px}.hl.l1{top:248px}.hl.l2{top:132px}
}
@media (prefers-reduced-motion:reduce){.beams,.wave i,.fdrops i{animation:none!important}}

/* ===== engine v2: the content wall ===== */
.eng .etop{display:grid;grid-template-columns:270px 64px 1fr;gap:0;align-items:stretch}
.eng .ebot{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.eng .ecol{min-height:0}
.erec .cam{flex:1;justify-content:space-between;padding:16px;gap:14px}
.erec .duo2{gap:12px;align-items:flex-start}
.erec .spk{display:flex;flex-direction:column;align-items:center;gap:6px}
.erec .spk small{font-size:11px;color:rgba(255,255,255,.75);white-space:nowrap}
.erec .duo2 .av{width:58px;height:58px;font-size:22px}
.erec .mic2{margin-top:12px}
.erec .wave{height:54px}
.topic{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.1)}
.topic span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#E8B460}
.topic b{font:500 16px/1.25 var(--serif)}
.earrow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--bloom-d);font-size:11px;font-weight:800;text-align:center;opacity:.35;transition:opacity .5s}
.earrow svg{width:26px;height:26px;padding:8px;box-sizing:content-box;border-radius:50%;background:linear-gradient(135deg,var(--bloom),var(--rose));color:#fff;box-shadow:0 10px 20px -8px rgba(194,85,122,.7)}
.eng[data-s="1"] .earrow,.eng[data-s="2"] .earrow,.eng[data-s="3"] .earrow,.eng[data-s="4"] .earrow,.eng.done .earrow{opacity:1}
.eng[data-s="1"] .earrow svg{animation:ping 1.2s infinite}
.wall{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:minmax(0,auto);gap:10px}

/* ===== First win v2: podium, orbit, radar ===== */
.fwlens{display:flex;gap:8px;flex-wrap:wrap;align-self:flex-end}
.fwl{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,#fff,var(--glass2));font:700 13.5px var(--sans);color:var(--muted);box-shadow:0 8px 18px -12px rgba(75,52,112,.4),inset 0 1px 0 #fff;transition:all .25s}
.fwl svg{width:17px;height:17px}
.fwl:hover{transform:translateY(-2px);color:var(--bloom-d)}
.fwl[aria-pressed="true"]{background:linear-gradient(135deg,var(--bloom),var(--bloom-d));color:#fff;border-color:transparent;box-shadow:0 14px 26px -12px rgba(75,52,112,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.fwl.tune[aria-expanded="true"]{color:var(--bloom-d);border-color:var(--bloom)}
.fwts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 22px;padding:14px 18px;margin-top:16px}
.fwts[hidden]{display:none}
.fwts label{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.fwts label span{display:inline-flex;align-items:center;gap:5px}.fwts svg{width:15px;height:15px;color:var(--bloom)}
.fwts input{accent-color:var(--bloom-d);width:100%}.fwts b{font-size:12px;color:var(--ink);min-width:28px}
/* 3D orbs */
.fworb3{--s:46px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;color:#fff;flex:none;position:relative;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9) 0 6%,rgba(255,255,255,.25) 22%,transparent 45%),radial-gradient(circle at 50% 60%,var(--c),color-mix(in srgb,var(--c) 55%,#000) 95%);
  box-shadow:0 14px 26px -10px color-mix(in srgb,var(--c) 80%,transparent),inset 0 -6px 12px rgba(0,0,0,.25)}
.fworb3 svg{width:46%;height:46%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.fworb3.big{--s:84px;animation:efloat 5s ease-in-out infinite}
.fworb3.mid{--s:62px}
/* podium */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:16px;align-items:end;margin-top:30px;perspective:1200px}
.fwp{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px 0;border:0;background:none;font-family:var(--sans);color:var(--ink);cursor:pointer;transform-style:preserve-3d;transition:transform .4s cubic-bezier(.2,.7,.2,1);animation:podin .7s cubic-bezier(.3,1.4,.5,1) both}
.fwp.p1{animation-delay:.1s}.fwp.p3{animation-delay:.2s}
@keyframes podin{from{opacity:0;transform:translateY(30px) scale(.9)}}
.fwp:hover{transform:translateY(-6px)}
.fwp b{font:500 20px/1.2 var(--serif);text-align:center;position:relative;z-index:1}
.fwp small{font-size:12.5px;color:var(--muted);position:relative;z-index:1}
.fwsc{font:500 34px/1 var(--serif);background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 50%,#000));-webkit-background-clip:text;background-clip:text;color:transparent;position:relative;z-index:1}
.medal{position:absolute;top:6px;left:50%;margin-left:30px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;z-index:2;background:linear-gradient(135deg,#B9B4C2,#7D7689);box-shadow:0 6px 12px -4px rgba(0,0,0,.35)}
.p1 .medal{background:linear-gradient(135deg,#F2C14E,#C98A2B)}.p3 .medal{background:linear-gradient(135deg,#E0A27A,#A8673F)}
.plinth{position:relative;width:100%;margin-top:10px;border-radius:18px 18px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.95),color-mix(in srgb,var(--c) 14%,#fff));border:1px solid var(--line);border-bottom:0;box-shadow:inset 0 1px 0 #fff,0 30px 40px -30px color-mix(in srgb,var(--c) 70%,transparent)}
.plinth::before{content:"";position:absolute;left:8%;right:8%;top:-10px;height:20px;border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--c) 35%,transparent),transparent 70%)}
.p1 .plinth{height:90px}.p2 .plinth{height:56px}.p3 .plinth{height:36px}
.fwp.on .plinth{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 30px 40px -24px color-mix(in srgb,var(--c) 80%,transparent)}
/* orbit + detail */
.fwmain{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;margin-top:22px;align-items:start}
.fworb{padding:14px;position:relative;overflow:visible}
#orbit{width:100%;height:auto;display:block;overflow:visible}
.fring{fill:none;stroke:var(--line2);stroke-dasharray:3 6;transform-origin:0 0;animation:fspin 80s linear infinite}
.fring.r1{animation-duration:120s;animation-direction:reverse}.fring.r0{stroke:rgba(47,125,98,.35);stroke-dasharray:none;fill:rgba(47,125,98,.05)}
@keyframes fspin{to{transform:rotate(360deg)}}
.frl{font:800 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;fill:var(--faint);text-anchor:middle}

.jview button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--sh1)}
.jview+.play{margin-left:0}
.jmx{position:relative;overflow-x:auto;margin:18px 0 18px;padding-bottom:6px;scrollbar-width:thin}
.jmlines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:2}
.jmlines path{fill:none;stroke:#C2557A;stroke-width:2.5;stroke-dasharray:5 6;opacity:.7;animation:dashmove 1.2s linear infinite}
.jmlines circle{fill:#C2557A}
@keyframes dashmove{to{stroke-dashoffset:-22}}
.jmg{display:grid;grid-template-columns:118px repeat(var(--n),minmax(150px,1fr));gap:8px;min-width:calc(118px + var(--n) * 158px)}
.jmh{position:relative;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;transition:all .4s}
.jmh.corner{background:none;border:0}
.jmh b{font:500 16px/1.2 var(--serif)}.jmh small{font-size:11.5px;color:var(--muted)}
.jmn{position:absolute;right:10px;top:8px;font:500 22px var(--serif);color:var(--faint)}
.jmh.on{background:linear-gradient(150deg,#fff,var(--bloom-s));border-color:var(--bloom);box-shadow:0 14px 26px -18px var(--bloom-d);transform:translateY(-3px)}
.jmh.on .jmn{color:var(--bloom-d)}
.jmh.done{opacity:.6}
.jmh.done .jmn::after{content:" ✓";font-size:14px;color:var(--leaf)}
.jmp{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:16px;position:sticky;left:0;z-index:3;background:linear-gradient(90deg,#fdfbf8 85%,transparent);transition:all .3s}
.jmp .jps{width:36px;height:36px;font-size:15px;flex:none}
.jmp b{font-size:13.5px}
.jmp.lead .jps{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent),0 10px 18px -8px var(--c);transform:scale(1.1)}
.jmp.help .jps{box-shadow:0 0 0 3px #fff,0 0 0 5px color-mix(in srgb,var(--c) 40%,transparent)}
.jmc{display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:16px;background:color-mix(in srgb,var(--c) 5%,transparent);border:1px dashed color-mix(in srgb,var(--c) 18%,transparent);min-height:52px}
.jtile{position:relative;display:flex;gap:8px;align-items:flex-start;text-align:left;padding:9px 10px;border-radius:13px;border:1px solid color-mix(in srgb,var(--c) 30%,transparent);background:linear-gradient(150deg,#fff,color-mix(in srgb,var(--c) 10%,#fff));box-shadow:0 8px 16px -12px var(--c);transition:transform .35s cubic-bezier(.3,1.3,.5,1),box-shadow .35s;cursor:pointer}
.jtile:hover{transform:translateY(-2px)}
.jtn{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:800 11px var(--sans);color:#fff;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.6),transparent 50%),var(--c)}
.jtt{font-size:12.5px;font-weight:700;line-height:1.3;color:var(--ink)}
.jtile.passed{opacity:.55}
.jtile.passed .jtn::after{content:"✓"}.jtile.passed .jtn{font-size:0}.jtile.passed .jtn::after{font-size:11px}
.jtile.on{transform:scale(1.05);border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent),0 16px 26px -14px var(--c);z-index:1}
.jhelp{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 3px;border-radius:99px;border:1px dashed color-mix(in srgb,var(--c) 45%,transparent);background:#fff;font:700 11px var(--sans);color:var(--muted);cursor:pointer}
.jhelp span{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,#fff);color:var(--c);font-size:10px}
.jhelp.on{border-style:solid;border-color:var(--c);background:var(--c);color:#fff;transform:scale(1.08);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent),0 10px 18px -10px var(--c);animation:helpglow 1.8s ease-in-out infinite}
.jhelp.on span{background:#fff;color:var(--c)}
@keyframes helpglow{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 12%,transparent),0 10px 18px -10px var(--c)}}
.jmg .jtile:not(.on),.jmg .jhelp:not(.on){opacity:.42;filter:saturate(.6);transition:opacity .3s,filter .3s}
.jmg .jtile:not(.on):hover,.jmg .jhelp:not(.on):hover{opacity:1;filter:none}
@media (prefers-reduced-motion:reduce){.jhelp.on{animation:none}}
.jhelp.passed{opacity:.5}
@media (max-width:560px){.jmg{grid-template-columns:76px repeat(var(--n),minmax(138px,1fr));min-width:calc(76px + var(--n) * 146px)}.jmp b{font-size:11px}.jmp{flex-direction:column;align-items:flex-start;gap:3px}.jmp .jps{width:30px;height:30px;font-size:13px}.jview{margin-left:0}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grain"></div>
<div id="app"></div>

<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="gseed" aria-hidden="true"></div>
  <p id="bootmsg">Opening our home</p>
  <button class="play" id="bootretry" type="button" hidden><span>Try again</span></button>
</div>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-t">
  <div class="gcardin">
    <div class="gseed" aria-hidden="true"></div>
    <form id="gform">
      <h2 id="gate-t">Welcome <em>home</em></h2>
      <p class="sub">Type your email and we send you a link. Tap it and you are in, no password.</p>
      <input id="gmail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required aria-label="Your email">
      <button class="play" id="gsend" type="submit"><i data-lucide="send"></i><span>Send my link</span></button>
      <div class="msg" id="gmsg" role="status"></div>
    </form>
    <div class="sent">
      <div class="env"><i data-lucide="mail-check"></i></div>
      <h2>Check your <em>inbox</em></h2>
      <p class="sub" id="gsent-t">The link is on its way. Open it on this phone or computer.</p>
      <button class="linkish" id="gagain" type="button">Use a different email</button>
    </div>
    
  </div>
</div>

<style>
.boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:24px;color:var(--muted);z-index:5}
.boot[hidden]{display:none}
.boot p{margin:0;font-size:16px;max-width:30ch}
</style>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* Sign-in shell. Nothing about the team is in this file: the page arrives from
   Supabase (table page_content) only after a team member signs in. */
(function(){
  const SB_URL="https://trribbpehmhzssuwpuyv.supabase.co";
  const SB_KEY="sb_publishable_dIPfxs_9bDqqu263gJGBPw_hi1MsytU";
  const $=s=>document.querySelector(s);
  const icons=()=>{if(window.lucide)lucide.createIcons()};
  let sb=null,started=false;
  try{sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){}
  window.__sb=sb;
  const boot=(t,retry)=>{$("#boot").hidden=false;$("#bootmsg").textContent=t;$("#bootretry").hidden=!retry};
  const gate=on=>{$("#gate").classList.toggle("on",on);if(on){$("#boot").hidden=true;setTimeout(()=>{const i=$("#gmail");i&&!$("#gate").classList.contains("sentmode")&&i.focus({preventScroll:true})},450)}};
  if(!sb){boot("We could not reach our home just now. Check your connection and try again.",true);$("#bootretry").onclick=()=>location.reload();return}

  async function open(session){
    if(started)return;
    if(!session){gate(true);return}
    started=true;gate(false);boot("Opening our home");
    try{
      const {data,error}=await sb.from("page_content").select("data").eq("id","app").maybeSingle();
      if(error)throw error;
      if(!data||!data.data||!data.data.html){
        await sb.auth.signOut().catch(()=>{});started=false;gate(true);
        $("#gmsg").className="msg bad";$("#gmsg").textContent="That email is not on our team list. Try the email you use with the team.";return}
      $("#app").innerHTML=data.data.html;
      const g=$("#gate");g.replaceWith(g.cloneNode(true));
      $("#boot").remove();
      window.SHELL=true;
      const s=document.createElement("script");s.textContent=data.data.js;document.body.appendChild(s);
    }catch(e){
      started=false;boot("We could not open the team page just now. Check your connection and try again.",true);
    }
  }
  $("#bootretry").onclick=()=>{sb.auth.getSession().then(({data})=>open(data.session)).catch(()=>location.reload())};

  const hash=new URLSearchParams(location.hash.slice(1));
  if(hash.get("error_description")){$("#gmsg").className="msg bad";$("#gmsg").textContent=hash.get("error_code")==="otp_expired"?"That link has expired. Send yourself a new one.":"That link did not work. Send yourself a new one.";history.replaceState(null,"",location.pathname)}
  $("#gform").addEventListener("submit",async e=>{e.preventDefault();
    const email=$("#gmail").value.trim().toLowerCase();if(!email)return;
    const btn=$("#gsend"),msg=$("#gmsg");btn.disabled=true;msg.className="msg";msg.textContent="Sending your link";
    let error=null;try{({error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}}))}catch(err){error=err}
    btn.disabled=false;
    if(error){const t=String(error.message||"");msg.className="msg bad";
      msg.textContent=/database error|team list|signups not allowed/i.test(t)?"That email is not on our team list. Try the email you use with the team.":/rate|security purposes|too many/i.test(t)?"Too many links in a short time. Wait a few minutes and try again.":"Something went wrong. Try again in a moment.";return}
    msg.textContent="";$("#gsent-t").textContent="The link is on its way to "+email+". Open it on this same phone or computer.";$("#gate").classList.add("sentmode");icons()});
  $("#gagain").onclick=()=>{$("#gate").classList.remove("sentmode");$("#gmsg").textContent="";$("#gmail").focus()};
  icons();
  sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>open(session),0)});
  sb.auth.getSession().then(({data})=>open(data.session)).catch(()=>open(null));
})();
</script>
</body>
</html>
