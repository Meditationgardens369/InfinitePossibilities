<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacaranda House</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF8F3">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Jacaranda House team home. Light only, phone first. One living tree, four people, three companies. */
:root{
  --paper:#FBF8F3; --paper2:#F5F0E8; --ink:#251E31; --muted:#6E6679; --faint:#9A92A6;
  --line:rgba(60,40,90,.12); --line2:rgba(60,40,90,.2);
  --bloom:#7B5EA7; --bloom-d:#4B3470; --bloom-s:#EFE8F8;
  --leaf:#2F7D62; --leaf-s:#E3F2EA; --sun:#C98A2B; --sun-s:#FAF0DE; --rose:#C2557A; --rose-s:#F9E6EC;
  --glass:rgba(255,255,255,.72); --glass2:rgba(255,255,255,.9);
  --sh1:0 1px 2px rgba(75,52,112,.06),0 4px 14px rgba(75,52,112,.07);
  --sh2:0 2px 6px rgba(75,52,112,.06),0 22px 50px -18px rgba(75,52,112,.28);
  --r:22px; --serif:Fraunces,Georgia,serif; --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--bloom);outline-offset:3px;border-radius:10px}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:clamp(40px,7.4vw,74px);line-height:1.02}
h2{font-size:clamp(30px,4.8vw,46px);line-height:1.06}
h3{font-size:21px;line-height:1.2;font-weight:600}
em{font-style:italic;color:var(--bloom)}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px;position:relative;z-index:2}
section{padding:72px 0 30px;position:relative}
.kicker{display:inline-flex;gap:10px;align-items:center;font:700 11.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--bloom);margin-bottom:14px}
.kicker::before{content:"";width:24px;height:1.5px;background:currentColor}
.lede{font-size:18px;color:var(--muted);max-width:58ch;margin-top:14px}
.small{font-size:14px;line-height:1.5}
.tiny{font-size:12.5px;color:var(--faint);line-height:1.5}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* living background */
.orb{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;animation:drift 26s ease-in-out infinite alternate}
.o1{width:520px;height:520px;background:#D9C8F2;top:-160px;left:-140px;opacity:.75}
.o2{width:440px;height:440px;background:#CDEBDD;bottom:-140px;right:-120px;opacity:.7;animation-duration:32s}
.o3{width:340px;height:340px;background:#F8DCC0;top:42%;left:58%;opacity:.55;animation-duration:38s}
@keyframes drift{to{transform:translate3d(70px,50px,0) scale(1.12)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.22;background-image:radial-gradient(rgba(75,52,112,.18) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%)}

/* top */
.top{position:sticky;top:0;z-index:50;background:rgba(251,248,243,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:60px}
.mark{display:flex;align-items:center;gap:10px;font:600 20px var(--serif);color:var(--bloom-d);white-space:nowrap}
.mark .seed{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#D7C2F3,var(--bloom) 55%,var(--bloom-d));box-shadow:0 0 0 4px var(--bloom-s);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 9px rgba(123,94,167,.12)}}
.clocks{display:flex;gap:8px;margin-left:8px}
.clock{font-size:12px;color:var(--muted);background:var(--glass2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.clock b{color:var(--ink);font-variant-numeric:tabular-nums}
.who{margin-left:auto;display:flex;align-items:center;gap:6px}
.who .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.who button{width:36px;height:36px;border-radius:50%;border:2px solid transparent;background:var(--c);color:#fff;font:700 14px var(--sans);transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s;opacity:.55}
.who button:hover{transform:translateY(-2px);opacity:.85}
.who button[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--c);transform:scale(1.06)}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 20px 10px;max-width:1120px;margin:0 auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px;padding:6px 14px;border-radius:99px;border:1px solid transparent;transition:all .25s}
.nav a:hover{color:var(--ink);background:var(--glass2)}
.nav a.on{color:var(--bloom-d);background:var(--bloom-s);border-color:rgba(123,94,167,.25)}

/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

/* hero */
.hero{padding-top:38px}
.hero .wrap{display:grid;grid-template-columns:1.02fr .98fr;gap:20px;align-items:center}
.hello{display:flex;width:fit-content;align-items:center;gap:10px;background:var(--glass2);border:1px solid var(--line);border-radius:99px;padding:6px 16px 6px 6px;font-weight:600;font-size:14px;box-shadow:var(--sh1);margin-bottom:22px}
.hello .av{width:28px;height:28px}
.treebox{position:relative;height:460px}
.treebox canvas{position:absolute;inset:0;width:100%;height:100%}
.legend{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.legend button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--glass2);border-radius:99px;padding:4px 12px 4px 4px;font-size:13px;font-weight:600;box-shadow:var(--sh1);transition:transform .25s,box-shadow .25s}
.legend button:hover,.legend button:focus-visible{transform:translateY(-3px);box-shadow:var(--sh2)}
.legend .av{width:24px;height:24px;font-size:11px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:28px}
.fact{padding:14px 14px 12px}
.fact b{display:block;font:300 40px/1 var(--serif);color:var(--bloom)}
.fact span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:6px}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:700 12px var(--sans);color:#fff;background:var(--c);flex:none}

/* today */
.today{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px;margin-top:6px}
.tile{padding:18px;position:relative;overflow:hidden}
.tile .k{font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tile .v{font:400 30px/1.1 var(--serif);margin-top:8px}
.tile .n{font-size:13px;color:var(--muted);margin-top:6px}
.tile.mine{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 14%,#fff),rgba(255,255,255,.75));border-color:color-mix(in srgb,var(--c) 30%,transparent)}
.tile.mine .v{font-size:22px;font-weight:600;line-height:1.25}
.ring{width:64px;height:64px;position:absolute;right:16px;top:16px}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--leaf);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.3,.9,.3,1);transform:rotate(-90deg);transform-origin:50% 50%}

/* lens toggle */
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--glass2);border:1px solid var(--line);border-radius:99px;padding:4px;position:relative;box-shadow:var(--sh1)}
.seg button{position:relative;z-index:1;border:0;background:transparent;padding:9px 18px;border-radius:99px;font-weight:700;font-size:13.5px;color:var(--muted);transition:color .3s}
.seg button[aria-pressed="true"]{color:#fff}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;border-radius:99px;background:linear-gradient(135deg,var(--bloom),var(--bloom-d));box-shadow:0 6px 18px -6px rgba(75,52,112,.6);transition:transform .45s cubic-bezier(.3,1.3,.5,1),width .45s}

/* gift cards */
/* your stories */
#storybox{padding-bottom:10px}
.sring{display:flex;align-items:center;gap:12px}
.sring b{display:block;font:600 22px var(--serif)}
.swho{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.swho .pchip[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 14%,#fff);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.sct{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:4px}
.stips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stips span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 12px;border-radius:99px;background:var(--glass2);border:1px solid var(--line);color:var(--muted)}
.stips svg{width:14px;height:14px;color:var(--bloom,#7B5EA7)}
.snote{display:flex;gap:8px;align-items:center;margin-top:18px;font-size:14px;background:#FBF6EC;border:1px dashed #E6D3AE;border-radius:14px;padding:10px 14px}
.snote svg{width:17px;height:17px;flex:none;color:#C98A2B}
.schap{margin-top:24px}
.schap h4{font:400 22px var(--serif);margin:0 0 10px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sq{position:relative;border-radius:22px;padding:18px 18px 16px;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 9%,#fff),#fff 65%);border:1px solid var(--line);box-shadow:var(--sh1,0 10px 30px -20px rgba(0,0,0,.25));display:flex;flex-direction:column;gap:8px;transition:transform .25s,box-shadow .25s}
.sq:hover{transform:translateY(-3px);box-shadow:0 22px 40px -26px var(--c)}
.sqn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--sans);color:#fff;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff),var(--c));box-shadow:0 8px 18px -8px var(--c)}
.sqn svg{width:17px;height:17px}
.sqq{font:400 18px/1.35 var(--serif);color:var(--ink);margin:0}
.sqh{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--muted);margin:0}
.sqh svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--c)}
.sqa{margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sqa .play{--c2:var(--c)}
.sq.told{background:linear-gradient(165deg,#EAF6EF,#fff 65%);border-color:#CFE8DA}
.sq.told .sqn{background:radial-gradient(circle at 35% 30%,#7CC8A2,#2F7D62)}
.toldl{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#2F7D62}
.toldl svg{width:15px;height:15px}
.qbanner{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px;border-radius:16px;background:#F3EEFB;border:1px solid #DCD0F2;margin-bottom:10px}
.qbanner[hidden]{display:none}
.qbanner>svg{width:20px;height:20px;color:#7B5EA7;margin-top:2px}
.qbanner b{display:block;font:400 16px/1.35 var(--serif);margin-top:2px}
.note .nq{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:#5B4C86;margin:6px 0 0}
.note .nq svg{width:14px;height:14px;flex:none;margin-top:2px}
@media (max-width:560px){.sgrid{grid-template-columns:1fr}.sqq{font-size:17px}}
/* full reading */
.rlist{display:grid;gap:18px;margin-top:16px}
.rcentre{border-radius:22px;padding:18px;background:linear-gradient(170deg,color-mix(in srgb,var(--cc) 10%,#fff),#fff 60%);border:1px solid color-mix(in srgb,var(--cc) 22%,transparent);box-shadow:0 18px 40px -28px var(--cc)}
.rcentre.grp{--cc:#3B3170;background:linear-gradient(170deg,#EFEBFA,#fff 60%)}
.rcentre header{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.rcentre .remb{filter:drop-shadow(0 16px 18px color-mix(in srgb,var(--cc) 30%,transparent));animation:efloat 7s ease-in-out infinite}
.rcentre .remb svg{display:block;overflow:visible}
.rcentre .k{font:700 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--cc)}
.rcentre h3{font:400 28px/1.1 var(--serif);margin:4px 0 6px}
.rcentre header p{color:var(--muted);font-size:14.5px;line-height:1.5}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:14px}
.rbox{border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.75);border:1px solid var(--line)}
.rbox>b{display:flex;align-items:center;gap:7px;font:700 12.5px var(--sans);color:color-mix(in srgb,var(--cc) 85%,#000);margin-bottom:6px}
.rbox>b svg{width:15px;height:15px}
.rbox ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px;line-height:1.45}
.rbox p{font-size:14px;line-height:1.5;margin:0}
.rbox.g1{background:color-mix(in srgb,var(--cc) 12%,#fff);border-color:color-mix(in srgb,var(--cc) 26%,transparent)}
.rbox.bad{background:#FFF6F3;border-color:#F2D6CC}.rbox.bad>b{color:#A4472E}
.rbox.good{background:#F2FAF5;border-color:#CFE8DA}.rbox.good>b{color:#2F7D62}
.rmiss{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted);background:#FBF6EC;border:1px dashed #E6D3AE;border-radius:12px;padding:8px 12px}
.rmiss svg{width:15px;height:15px;flex:none;color:#C98A2B}
@media (max-width:560px){.rcentre header{grid-template-columns:1fr;justify-items:start}.rcentre h3{font-size:24px}}
/* 3D emblems */
.front .groles{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center}
.front .groles .k{width:100%;font:700 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rchip{font-size:12.5px;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--cc) 12%,#fff);border:1px solid color-mix(in srgb,var(--cc) 25%,transparent);color:color-mix(in srgb,var(--cc) 80%,#000)}
.estage{position:relative;height:200px;margin:6px -6px 4px;pointer-events:none}
.eorb{position:absolute;animation:efloat 7s ease-in-out infinite;filter:drop-shadow(0 22px 22px color-mix(in srgb,var(--c) 30%,transparent))}
.eorb .emb{display:block;overflow:visible}
.estage.one .e0{left:50%;top:50%;margin:-80px 0 0 -80px}
.estage.two .e0{left:calc(50% - 128px);top:12px}
.estage.two .e1{left:calc(50% + 4px);top:62px;animation-delay:-2.6s}
.estage .eg{right:4%;top:0;animation-delay:-4.2s;filter:drop-shadow(0 14px 16px rgba(43,36,89,.35))}
.estage .eu{right:calc(4% + 54px);top:84px;animation-delay:-1.3s;filter:drop-shadow(0 10px 12px rgba(43,36,89,.3))}
.estage.one .eg{right:10%}
@keyframes efloat{50%{transform:translateY(-9px)}}
.gcard:hover .eorb{animation-duration:4s}
.front .glines{display:grid;gap:9px;margin-top:12px}
.front .gl{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px;line-height:1.45;color:var(--ink)}
.front .gl .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--cc);color:#fff;font:700 11.5px var(--sans);margin-top:1px;box-shadow:0 6px 14px -6px var(--cc)}
.front .gl b{color:color-mix(in srgb,var(--cc) 85%,#000)}
.front .gl.grp .num{background:linear-gradient(140deg,#5B4CA8,#1F1A45);--cc:#3B3170}
.front .gl.grp .num svg{width:13px;height:13px}
@media (prefers-reduced-motion: reduce){.eorb{animation:none}}
.gifts{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:26px;perspective:1600px}
.gcard{height:710px;position:relative;cursor:pointer;border:0;background:transparent;padding:0;text-align:left;transform-style:preserve-3d;transition:transform .2s ease-out}
.gin{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.15,.4,1)}
.gcard.flip .gin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh2)}
.front{background:radial-gradient(120% 80% at 80% 0%,color-mix(in srgb,var(--c) 34%,#fff) 0%,transparent 60%),linear-gradient(170deg,color-mix(in srgb,var(--c) 10%,#fff),#fff 70%);padding:22px;display:flex;flex-direction:column}
.front .glow{position:absolute;width:240px;height:240px;border-radius:50%;right:-70px;top:-60px;background:radial-gradient(circle,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%);animation:breathe2 6s ease-in-out infinite}
@keyframes breathe2{50%{transform:scale(1.15);opacity:.7}}
.front .who2{display:flex;align-items:center;gap:10px;position:relative}
.front .who2 .av{width:44px;height:44px;font-size:17px;box-shadow:0 8px 20px -8px var(--c)}
.front .who2 small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.front .who2 b{font:600 19px var(--serif)}
.sigil{position:relative;margin:20px auto 14px;width:104px;height:104px;display:grid;place-items:center}
.sigil::before,.sigil::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--c) 45%,transparent);animation:spin 28s linear infinite}
.sigil::after{inset:16px;border-style:solid;border-color:color-mix(in srgb,var(--c) 25%,transparent);animation-duration:18s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.sigil .core{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,color-mix(in srgb,var(--c) 30%,#fff));color:var(--c);box-shadow:0 10px 30px -8px var(--c)}
.sigil .core svg{width:28px;height:28px}
.front .label{font:700 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.front .gname{font:400 clamp(22px,2.1vw,27px)/1.1 var(--serif);margin-top:6px;overflow-wrap:break-word;hyphens:auto}
.front .gmean{color:var(--muted);font-size:14.5px;margin-top:10px}
.front .turn{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--c)}
.front .turn svg{width:15px;height:15px;transition:transform .4s}
.gcard:hover .turn svg{transform:rotate(180deg)}
.front.unknown .gname{color:var(--muted)}
.front.unknown .sigil .core{animation:shimmer 2.6s ease-in-out infinite}
@keyframes shimmer{50%{transform:scale(.9);opacity:.6}}
.back{transform:rotateY(180deg);background:var(--glass2);padding:18px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;scrollbar-width:thin}
.back .proof{flex:none}
.back .hd{display:flex;align-items:center;gap:10px}
.back .hd b{font:600 19px var(--serif)}
.back .lane{font-size:12.5px;color:var(--muted);line-height:1.35}
.skills{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:7px}
.skills li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13px;line-height:1.28}
.lv{display:flex;gap:3px}
.lv i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.lv i.on{background:var(--c)}
.proof{font-size:12.5px;line-height:1.45;background:color-mix(in srgb,var(--c) 9%,#fff);border:1px solid color-mix(in srgb,var(--c) 22%,transparent);border-radius:14px;padding:9px 11px;margin-top:auto}
.proof b{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin-bottom:2px}
.toolz{display:flex;flex-wrap:wrap;gap:4px}
.toolz span{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--paper2);color:var(--muted)}
.lvkey{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--muted)}
.lvkey span{display:flex;align-items:center;gap:6px}
.lvkey .lv i.on{background:var(--bloom)}

/* map + finder */
.duo{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;margin-top:26px}
.panel{padding:22px}
.radarwrap{position:relative}
#radar{width:100%;height:auto;display:block;max-width:560px;margin:0 auto;touch-action:none}
#radar .ax{stroke:var(--line2);stroke-width:1}
#radar .rg{fill:none;stroke:var(--line);stroke-width:1}
#radar .al{font:700 13.5px var(--sans);fill:var(--muted);letter-spacing:.02em}
#radar polygon{transition:opacity .35s,fill-opacity .35s}
#radar .pt{cursor:grab;transition:r .2s}
#radar .pt:hover{r:9}
.pchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.pchip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--glass2);border-radius:99px;padding:3px 12px 3px 3px;font-weight:600;font-size:13px;transition:all .25s}
.pchip .av{width:24px;height:24px;font-size:11px}
.pchip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.pchip.off{opacity:.45}
.mapnote{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.ghost[aria-pressed="true"]{background:var(--bloom-s);color:var(--bloom-d);border-color:rgba(123,94,167,.35)}
.ghost:hover{background:var(--glass2);color:var(--ink)}
.ask{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line2);border-radius:18px;padding:6px 6px 6px 16px;box-shadow:var(--sh1);transition:border-color .25s,box-shadow .25s}
.ask:focus-within{border-color:var(--bloom);box-shadow:0 0 0 5px var(--bloom-s)}
.ask svg{width:20px;height:20px;color:var(--bloom);flex:none}
.ask input{flex:1;border:0;outline:0;background:transparent;font-size:16px;padding:10px 0;min-width:0}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px}
.sugg button{border:1px dashed var(--line2);background:transparent;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted);transition:all .2s}
.sugg button:hover{border-style:solid;color:var(--bloom-d);background:var(--bloom-s)}
.res{display:grid;gap:8px}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);transition:transform .45s cubic-bezier(.3,1.2,.5,1),opacity .35s,box-shadow .3s}
.rrow.top1{box-shadow:0 14px 34px -16px var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.rrow.none{opacity:.45}
.rrow .meter{height:6px;border-radius:6px;background:var(--paper2);overflow:hidden;margin-top:6px}
.rrow .meter i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .6s cubic-bezier(.3,.9,.3,1)}
.rrow b{font-size:14.5px}
.rrow .hit{font-size:12px;color:var(--muted)}
.rrow .hit mark{background:color-mix(in srgb,var(--c) 18%,#fff);color:var(--ink);border-radius:5px;padding:0 4px}
.rrow .sc{font:400 22px var(--serif);color:var(--c)}

/* jobs */
.jobchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.jc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass2);border-radius:16px;padding:10px 14px;font-weight:700;font-size:14px;text-align:left;box-shadow:var(--sh1);transition:all .25s}
.jc svg{width:18px;height:18px;color:var(--c)}
.jc small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.jc[aria-pressed="true"]{background:linear-gradient(140deg,color-mix(in srgb,var(--c) 16%,#fff),#fff);border-color:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 14px 30px -16px var(--c)}
.journey{margin-top:16px;padding:22px 22px 18px;overflow:hidden}
.jtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.play{border:0;background:linear-gradient(135deg,var(--bloom),var(--bloom-d));color:#fff;font-weight:700;padding:10px 20px;border-radius:99px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 12px 28px -10px rgba(75,52,112,.7);transition:transform .2s}
.play:active{transform:scale(.96)}
.play svg{width:16px;height:16px}
.track{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(118px,1fr);gap:8px;overflow-x:auto;padding:8px 2px 14px;scroll-snap-type:x proximity}
.track::before{content:"";position:absolute;left:30px;right:30px;top:37px;height:3px;border-radius:3px;background:var(--line)}
.track .fill{position:absolute;left:30px;top:37px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--bloom),var(--rose));transition:width .7s cubic-bezier(.3,.9,.3,1);box-shadow:0 0 12px rgba(123,94,167,.5)}
.stage{position:relative;border:0;background:transparent;padding:0;text-align:center;scroll-snap-align:start}
.stage .node{position:relative;z-index:1;width:58px;height:58px;margin:0 auto;border-radius:50%;background:#fff;border:2px solid var(--line2);display:grid;place-items:center;transition:all .45s cubic-bezier(.3,1.3,.5,1)}
.stage .node .av{width:40px;height:40px;font-size:15px}
.stage .node .av + .av{position:absolute;right:-8px;bottom:-6px;width:24px;height:24px;font-size:10px;box-shadow:0 0 0 2px #fff}
.stage .st{display:block;margin-top:10px;font-weight:700;font-size:13px;line-height:1.25;color:var(--muted);padding:0 4px;transition:color .3s}
.stage .no{display:block;font:400 12px var(--serif);color:var(--faint)}
.stage.on .node{border-color:var(--bloom);transform:scale(1.12);box-shadow:0 0 0 6px var(--bloom-s),0 12px 26px -10px rgba(75,52,112,.6)}
.stage.on .st{color:var(--ink)}
.stage.passed .node{border-color:color-mix(in srgb,var(--bloom) 60%,transparent)}
.stage.mine .node::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px dashed var(--me);animation:spin 12s linear infinite}
.detail{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;padding:16px 18px;border-radius:18px;background:linear-gradient(140deg,var(--bloom-s),#fff);border:1px solid rgba(123,94,167,.2);margin-top:6px;min-height:104px}
.detail h3{font-size:20px}
.detail p{color:var(--muted);font-size:14.5px;margin-top:6px}
.roles{display:grid;gap:6px;min-width:190px}
.role{display:flex;align-items:center;gap:8px;font-size:13px}
.role em{font-style:normal;font-weight:700;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);width:44px}
.carry{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.cy{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.cy .meter{flex:1;height:8px;border-radius:8px;background:var(--paper2);overflow:hidden}
.cy .meter i{display:block;height:100%;background:var(--c);border-radius:8px;transition:width .8s cubic-bezier(.3,.9,.3,1)}
.cy small{font-size:12px;color:var(--muted);white-space:nowrap}

/* vision */
.vine{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px;position:relative}
.vstage{padding:24px;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.vstage:hover{transform:translateY(-6px);box-shadow:var(--sh2)}
.vstage .yr{font:400 14px var(--serif);color:var(--faint)}
.vstage h3{font-size:26px;font-weight:400;margin-top:6px}
.vstage p{color:var(--muted);font-size:14.5px;margin-top:10px}
.vstage .big{position:absolute;right:16px;top:6px;font:300 90px/1 var(--serif);color:rgba(75,52,112,.07)}
.vstage.now{background:linear-gradient(160deg,var(--leaf-s),rgba(255,255,255,.8) 70%);border-color:rgba(47,125,98,.3)}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:4px 11px;font:700 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;margin-top:16px}
.pill.now{background:var(--leaf-s);color:var(--leaf)}
.pill.now::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--leaf);box-shadow:0 0 0 0 rgba(47,125,98,.5);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(47,125,98,0)}}
.pill.next{background:var(--bloom-s);color:var(--bloom-d)}
.pill.later{background:var(--sun-s);color:#8A5D16}
.pill svg{width:13px;height:13px}

/* companies */
.cos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px;perspective:1200px}
.co{padding:24px;position:relative;overflow:hidden;transform-style:preserve-3d;transition:transform .25s ease-out,box-shadow .35s}
.co:hover{box-shadow:0 30px 60px -28px var(--c)}
.co::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,#fff))}
.co .badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);transform:translateZ(30px)}
.co .badge svg{width:26px;height:26px}
.co h3{font-size:24px;font-weight:400;margin-top:16px}
.co .leads{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--muted)}
.co .leads .av{width:26px;height:26px;font-size:11px}
.co ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:7px;font-size:14.5px}
.co li{display:flex;gap:9px;align-items:flex-start}
.co li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);margin-top:.55em;flex:none}
.co .first{margin-top:16px;background:color-mix(in srgb,var(--c) 9%,#fff);border-radius:14px;padding:11px 13px;font-size:14px}
.co .first b{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}

/* work */
.work{display:grid;grid-template-columns:1fr 1.3fr;gap:16px;margin-top:26px}
.work > *,.duo > *,.brand > *,.hero .wrap > *,.journey{min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--glass2);border-radius:99px;padding:6px 14px;font-weight:700;font-size:13px;color:var(--muted);transition:all .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:transparent}
.steps{margin-top:12px;padding:6px}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;transition:background .3s}
.step:hover{background:rgba(255,255,255,.7)}
.step + .step{border-top:1px solid var(--line)}
.tick{position:relative;width:24px;height:24px;flex:none;margin-top:1px}
.tick input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.tick span{position:absolute;inset:0;border-radius:8px;border:2px solid var(--line2);background:#fff;display:grid;place-items:center;transition:all .35s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.tick span svg{width:15px;height:15px;color:#fff;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.tick input:checked + span{background:var(--leaf);border-color:var(--leaf)}
.tick input:checked + span svg{transform:scale(1)}
.tick input:focus-visible + span{outline:3px solid var(--bloom);outline-offset:2px}
.step label{flex:1;cursor:pointer}
.step .t{font-weight:700;font-size:14.5px;line-height:1.35}
.step .n{color:var(--muted);font-size:13px}
.step.done .t{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--leaf)}
.avs{display:flex;flex:none}
.avs .av{width:26px;height:26px;font-size:10.5px;box-shadow:0 0 0 2px #fff}
.avs .av + .av{margin-left:-7px}
.empty{padding:18px;color:var(--muted);font-size:14px}
.petal{position:fixed;width:10px;height:7px;border-radius:50% 50% 50% 0;pointer-events:none;z-index:200;animation:burst 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;padding:12px}
.col{background:rgba(255,255,255,.55);border:1.5px dashed var(--line2);border-radius:18px;padding:8px;min-height:250px;transition:background .25s,border-color .25s}
.col.over{background:var(--bloom-s);border-color:var(--bloom)}
.col h4{margin:4px 6px 10px;font:700 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.deal{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:9px 10px;margin-bottom:8px;font-size:13px;box-shadow:var(--sh1);transition:box-shadow .2s,transform .2s}
.deal:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.deal b{display:block;font-size:13.5px;line-height:1.3}
.deal small{color:var(--muted);font-size:12px;display:block}
.deal .mv{display:flex;justify-content:space-between;margin-top:6px}
.deal .mv button{border:0;background:var(--paper2);border-radius:8px;width:26px;height:22px;display:grid;place-items:center;color:var(--muted)}
.deal .mv button svg{width:14px;height:14px}
.deal .mv button:disabled{opacity:.3;cursor:default}
.deal.drag{position:fixed;z-index:300;cursor:grabbing;pointer-events:none;transform:rotate(3deg) scale(1.05);box-shadow:0 30px 60px -16px rgba(75,52,112,.55);margin:0}
.ph{border:2px dashed var(--line2);border-radius:14px;margin-bottom:8px}
.boardnote{padding:0 16px 14px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.boardnote svg{width:16px;height:16px;color:var(--sun);flex:none}

/* ideas */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}
.idea{padding:18px;transition:transform .4s cubic-bezier(.2,.7,.2,1),opacity .3s,box-shadow .3s}
.idea:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:var(--sh2)}
.idea .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c)}
.idea .ic svg{width:19px;height:19px}
.idea b{display:block;font:600 17px/1.25 var(--serif);margin-top:12px}
.idea small{display:block;color:var(--muted);font-size:13.5px;margin-top:4px}
.idea .pill{margin-top:12px}

/* brand */
.brand{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;margin-top:26px}
.checks{display:grid;gap:8px}
.chk{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:14.5px;text-align:left;width:100%;transition:all .25s}
.chk .b{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--bloom-s);color:var(--bloom-d);transition:all .3s}
.chk .b svg{width:15px;height:15px}
.chk[aria-pressed="true"]{background:var(--leaf-s);border-color:rgba(47,125,98,.25)}
.chk[aria-pressed="true"] .b{background:var(--leaf);color:#fff}
.chk[aria-pressed="true"] span:last-child{color:var(--muted);text-decoration:line-through}
.handles{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.handles button{font:600 12.5px var(--sans);background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 10px;transition:all .2s;color:var(--bloom-d)}
.handles button:hover{border-color:var(--bloom);background:var(--bloom-s)}
.handles button.ok{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.warn{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--sun-s);font-size:13.5px;color:#7A5418}
.warn svg{width:18px;height:18px;flex:none;margin-top:2px}

footer{padding:60px 0 80px}
.foot{padding:22px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;font-weight:600}
.flow span{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.flow span svg{width:15px;height:15px;color:var(--bloom)}
.flow > svg{width:16px;height:16px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:400;transition:all .4s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}

/* signed in: me + live dot */
.meav{display:flex;align-items:center;gap:8px;position:relative}
.meav .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--leaf);background:var(--leaf-s);border-radius:99px;padding:3px 10px;white-space:nowrap}
.meav .live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 2.4s ease-out infinite}
.meav .live.off{color:var(--sun);background:var(--sun-s)}
.meav .live.off::before{animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,125,98,.45)}100%{box-shadow:0 0 0 9px rgba(47,125,98,0)}}
.who .mebtn{opacity:1;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--c)}
.memenu{position:absolute;right:0;top:46px;min-width:220px;padding:14px;border-radius:18px;z-index:60}
.memenu b{display:block;font:600 17px var(--serif)}
.memenu .tiny{margin:2px 0 12px;word-break:break-all}
.memenu .ghost{width:100%;display:inline-flex;justify-content:center;gap:6px;align-items:center;padding:8px 12px}
.memenu .ghost svg{width:15px;height:15px}

/* sign in */
.gate{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:16px;background:rgba(251,248,243,.62);backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);opacity:0;pointer-events:none;transition:opacity .5s}
.gate.on{opacity:1;pointer-events:auto}
.gcardin{width:100%;max-width:420px;padding:34px 28px 26px;text-align:center;border-radius:28px;background:var(--glass2);box-shadow:var(--sh2);position:relative;overflow:hidden;transform:translateY(14px) scale(.98);transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.gate.on .gcardin{transform:none}
.gcardin::before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,#E3D5F6,transparent 70%);top:-150px;left:50%;transform:translateX(-50%);pointer-events:none}
.gseed{width:58px;height:58px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#D7C2F3,var(--bloom) 55%,var(--bloom-d));box-shadow:0 0 0 8px var(--bloom-s);animation:breathe 4s ease-in-out infinite;position:relative}
.gate h2{font-size:clamp(30px,8vw,40px);position:relative}
.gate p.sub{color:var(--muted);margin:10px auto 22px;max-width:30ch;position:relative}
.gate form{display:grid;gap:10px;position:relative}
.gate input{width:100%;border:1px solid var(--line2);background:#fff;border-radius:16px;padding:14px 16px;font-size:16px;text-align:center;outline:none;transition:border-color .2s,box-shadow .2s}
.gate input:focus{border-color:var(--bloom);box-shadow:0 0 0 4px var(--bloom-s)}
.gate .play{justify-content:center;padding:14px 20px;font-size:15px}
.gate .play[disabled]{opacity:.6;cursor:wait}
.gate .msg{min-height:22px;font-size:14px;font-weight:600;margin-top:4px}
.gate .msg.bad{color:var(--rose)}
.gate .msg.ok{color:var(--leaf)}
.gate .faces{display:flex;justify-content:center;margin-top:22px;position:relative}
.gate .faces .av{width:34px;height:34px;font-size:13px;margin-left:-8px;box-shadow:0 0 0 3px #fff}
.gate .faces .av:first-child{margin-left:0}
.gate .sent{display:none;position:relative}
.gate.sentmode form{display:none}
.gate.sentmode .sent{display:block}
.gate .sent .env{width:64px;height:64px;margin:4px auto 12px;border-radius:20px;background:var(--leaf-s);color:var(--leaf);display:grid;place-items:center}
.gate .sent .env svg{width:30px;height:30px}
/* tabs */
.nav button{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;padding:7px 14px;border-radius:99px;transition:all .25s}
.nav button svg{width:15px;height:15px}
.nav button:hover{color:var(--ink);background:var(--glass2)}
.nav button[aria-selected="true"]{color:var(--bloom-d);background:var(--bloom-s);border-color:rgba(123,94,167,.25)}
.tabpanel{animation:tabin .5s cubic-bezier(.2,.7,.2,1)}
.tabpanel > section:first-child{padding-top:44px}
@keyframes tabin{from{opacity:0;transform:translateY(10px)}}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--bloom),var(--sh2)}100%{box-shadow:0 0 0 0 transparent}}
input,select,textarea{font:inherit;color:inherit}

/* strength bars */
.bars{display:grid;gap:14px}
.brow{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center}
.bl{font-weight:700;font-size:13px;line-height:1.25}
.bb{display:grid;gap:4px}
.bar1{display:grid;grid-template-columns:16px 1fr 26px;gap:7px;align-items:center;font-size:11px}
.bar1 em{font:700 10.5px var(--sans);font-style:normal;color:var(--c);text-align:center}
.bar1 .tr{height:9px;border-radius:9px;background:var(--paper2);overflow:hidden}
.bar1 .tr i{display:block;height:100%;width:var(--w);border-radius:9px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c));transition:width .7s cubic-bezier(.3,.9,.3,1)}
.bar1 small{color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums}
.bar1.top .tr{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.bar1.top small{color:var(--c)}

/* proof bank */
.proofgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:16px;align-items:start}
.proofgrid > *{min-width:0}
.prooflist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pitem{padding:18px;position:relative;overflow:hidden;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pitem::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.pbig{font:400 clamp(28px,4vw,38px)/1.05 var(--serif);color:var(--c);letter-spacing:-.02em}
.pbig.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 13%,#fff)}
.pbig.ic svg{width:22px;height:22px}
.ptxt{font-size:14px;margin-top:8px;color:var(--ink)}
.ptxt b{font-weight:700}
.pitem .pill{margin-top:12px}
.pill.tc{background:var(--sun-s);color:#8A5D16}
.empty2{padding:20px;color:var(--muted);font-size:14.5px}
.pmiss{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--bloom-s);font-size:13.5px;color:var(--bloom-d)}
.pmiss svg{width:17px;height:17px;flex:none;margin-top:2px}
.pconf{grid-column:1/-1;background:#fff;border:1px dashed var(--line2);border-radius:14px;padding:10px 14px;font-size:13.5px}
.pconf summary{cursor:pointer;font-weight:700;display:flex;gap:8px;align-items:center;color:#8A5D16}
.pconf summary svg{width:16px;height:16px}
.pconf ul{margin:10px 0 2px;padding-left:20px;color:var(--muted);display:grid;gap:4px}
.intro{position:sticky;top:130px}
.ihead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ihead .pill{margin:0}
#ikinds{margin:12px 0 14px}
#ikinds .chip:disabled{opacity:.4;cursor:default}
.frame{aspect-ratio:16/9;border-radius:16px;position:relative;overflow:hidden;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--c) 45%,#2a2135),#1d1727 70%);margin-bottom:14px;box-shadow:var(--sh2)}
.frame::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 4px)}
.frame .rec-dot{position:absolute;top:12px;right:14px;font:700 10px var(--sans);letter-spacing:.14em;color:#fff;display:flex;gap:6px;align-items:center;opacity:.85}
.frame .rec-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:#E5484D;animation:ping 1.6s infinite}
.lt{position:absolute;left:5%;bottom:12%;max-width:88%;display:grid;animation:ltin .9s cubic-bezier(.2,.8,.2,1) both}
.lt b{background:#fff;color:var(--ink);font:600 clamp(15px,2.2vw,19px) var(--serif);padding:6px 14px;border-left:5px solid var(--c);width:fit-content}
.lt span{background:var(--c);color:#fff;font:700 clamp(10px,1.4vw,12px) var(--sans);letter-spacing:.04em;padding:5px 14px;width:fit-content}
@keyframes ltin{from{opacity:0;transform:translateX(-24px)}}
.itext{font-size:15px;line-height:1.6;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.itext mark.gap{background:var(--sun-s);color:#8A5D16;border-radius:5px;padding:0 4px}
.iactions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.iactions .play[disabled]{opacity:.4}

/* tests */
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:22px}
.test{padding:18px;display:grid;gap:10px;border-top:5px solid var(--bloom)}
.test.st-running{border-top-color:var(--sun)}.test.st-won{border-top-color:var(--leaf)}.test.st-lost,.test.st-stopped{border-top-color:var(--faint);opacity:.8}
.thead{display:flex;gap:10px;align-items:center}
.thead b{font:600 17px/1.25 var(--serif)}
.tm{display:flex;gap:8px;font-size:13.5px;color:var(--muted)}
.tm svg{width:16px;height:16px;flex:none;margin-top:3px;color:var(--bloom)}
.tsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tsteps span{font:700 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-top:4px solid var(--paper2);padding-top:6px;transition:all .4s}
.tsteps span.on{color:var(--ink);border-color:var(--bloom)}
.st-won .tsteps span.on{border-color:var(--leaf)}
.tact{display:flex;gap:6px;flex-wrap:wrap}
.addform{display:grid;gap:12px;margin-top:16px;max-width:640px}
.addform label{display:grid;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.addform input,.addform select,.addform textarea{border:1px solid var(--line2);background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:500;color:var(--ink);outline:none;width:100%;resize:vertical}
.addform input:focus,.addform select:focus,.addform textarea:focus{border-color:var(--bloom);box-shadow:0 0 0 4px var(--bloom-s)}
.frow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.frow label{flex:1;min-width:160px}

/* interviews */
.guests{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:26px}
.guest{padding:24px;position:relative;overflow:hidden}
.guest::before{content:"";position:absolute;inset:0 0 auto;height:110px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,#fff),transparent);pointer-events:none}
.ghead{display:flex;gap:14px;align-items:center;position:relative}
.av.big{width:58px;height:58px;font-size:22px;box-shadow:0 0 0 4px #fff,0 10px 24px -10px var(--c)}
.ghead b{font:600 24px var(--serif)}
.gangle{margin-top:14px;font:italic 400 17px/1.45 var(--serif);color:var(--ink);position:relative}
.guest h4{margin:18px 0 8px;font:700 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.learn{margin:0;padding:0;list-style:none;counter-reset:q;display:grid;gap:7px}
.learn li{counter-increment:q;display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:14.5px}
.learn li::before{content:counter(q);width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);font:700 12px var(--sans)}
.gstat{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:20px}
.gstat button{border:0;background:none;padding:0;display:grid;gap:6px;text-align:left;font:700 10px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.gstat button i{height:6px;border-radius:6px;background:var(--paper2);transition:background .4s}
.gstat button.on i{background:var(--c)}
.gstat button.on{color:var(--ink)}
.gstat button.cur span{color:var(--c)}
.gstat button:disabled{cursor:default}
.gdate{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-size:13px;font-weight:700;color:var(--muted)}
.gdate input{border:1px solid var(--line2);border-radius:10px;padding:6px 10px;background:#fff}
.gcount{display:flex;gap:8px}
.gcount div{background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:10px 16px;text-align:center}
.gcount b{display:block;font:400 30px/1 var(--serif);color:var(--bloom-d)}
.gcount span{font-size:11.5px;color:var(--muted);font-weight:700}

/* timeline */
.tlwrap{display:grid;grid-template-columns:1fr minmax(0,380px);gap:24px;align-items:start;margin-top:22px}
.tlwrap > *{min-width:0}
.tlwrap .addform{margin-top:0;position:sticky;top:130px}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--bloom),color-mix(in srgb,var(--bloom) 15%,transparent));border-radius:2px}
.tld{font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--bloom);margin:22px 0 10px 18px}
.tld:first-child{margin-top:0}
.tli{position:relative;margin:0 0 12px 18px;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.tldot{position:absolute;left:-46px;top:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--bloom);color:var(--bloom);box-shadow:0 0 0 5px var(--paper)}
.tldot svg{width:16px;height:16px}
.tldot.k-call{border-color:var(--leaf);color:var(--leaf)}.tldot.k-win{background:var(--sun);border-color:var(--sun);color:#fff}.tldot.k-voice{border-color:var(--rose);color:var(--rose)}.tldot.k-decision{border-color:var(--sun);color:var(--sun)}
.tlc{padding:14px 16px;display:grid;gap:6px}
.tlt{display:grid}
.tlt b{font:600 18px/1.3 var(--serif)}
.tlc p{font-size:14px;color:var(--muted)}

/* chat + inbox */
.fab{position:fixed;right:18px;bottom:18px;z-index:120;width:60px;height:60px;border-radius:50%;border:0;color:#fff;background:linear-gradient(135deg,var(--bloom),var(--bloom-d));box-shadow:0 16px 36px -10px rgba(75,52,112,.75);display:grid;place-items:center;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.fab:hover{transform:translateY(-3px) scale(1.04)}
.fab svg{width:26px;height:26px}
.fab .badge{position:absolute;top:-2px;right:-2px;min-width:22px;height:22px;border-radius:11px;background:var(--rose);color:#fff;font:800 11.5px/22px var(--sans);padding:0 6px;box-shadow:0 0 0 3px var(--paper);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}}
.drawer{position:fixed;right:18px;bottom:90px;z-index:130;width:min(420px,calc(100vw - 32px));height:min(660px,calc(100vh - 120px));display:flex;flex-direction:column;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 80px -24px rgba(75,52,112,.5);opacity:0;transform:translateY(16px) scale(.97);transform-origin:bottom right;transition:opacity .3s,transform .4s cubic-bezier(.3,1.3,.5,1)}
.drawer.on{opacity:1;transform:none}
.dhead{display:flex;align-items:center;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.dtabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.dtabs button{flex:none;display:inline-flex;gap:6px;align-items:center;border:0;background:transparent;border-radius:99px;padding:8px 12px;font-weight:700;font-size:13px;color:var(--muted)}
.dtabs button svg{width:15px;height:15px}
.dtabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.cnt{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--rose);color:#fff;font:800 10.5px/18px var(--sans);padding:0 5px;text-align:center}
.x{border:0;background:var(--paper2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.x svg{width:17px;height:17px}
.dpane{flex:1;min-height:0;display:flex;flex-direction:column}
#pane-tell{overflow-y:auto;padding:14px 16px 18px;gap:12px}
.msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px}
.mday{align-self:center;font:700 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:8px 0 2px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%;animation:rise .35s ease-out both}
.msg .av{width:28px;height:28px;font-size:11px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:#fff;border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:8px 12px;font-size:14.5px;line-height:1.45;box-shadow:var(--sh1);overflow-wrap:anywhere}
.bub b{display:block;font-size:12px;color:var(--c)}
.msg.me .bub{background:linear-gradient(135deg,var(--bloom),var(--bloom-d));color:#fff;border:0;border-radius:18px 18px 6px 18px}
.bub time{display:block;font-size:10.5px;opacity:.6;margin-top:2px;text-align:right}
.about{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:12px;font-weight:700;color:var(--bloom-d);background:var(--bloom-s);border-radius:99px;padding:3px 9px;text-decoration:none}
.msg.me .about{background:rgba(255,255,255,.2);color:#fff}
.about svg{width:13px;height:13px}
.composer{border-top:1px solid var(--line);padding:10px 12px 12px;display:grid;gap:8px}
.aboutl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.aboutl svg{width:14px;height:14px;flex:none}
.aboutl select{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 8px;font-size:12.5px}
.crow{display:flex;gap:8px;align-items:flex-end}
.crow textarea{flex:1;resize:none;border:1.5px solid var(--line2);border-radius:18px;padding:10px 14px;font-size:15px;max-height:140px;outline:none;background:#fff}
.crow textarea:focus{border-color:var(--bloom);box-shadow:0 0 0 4px var(--bloom-s)}
.send{width:44px;height:44px;border-radius:50%;border:0;flex:none;background:var(--bloom);color:#fff;display:grid;place-items:center}
.send svg{width:18px;height:18px}
.tellnote{color:var(--muted)}
.rec{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--bloom-s)}
.mic{width:64px;height:64px;border-radius:50%;border:0;flex:none;background:linear-gradient(135deg,var(--bloom),var(--bloom-d));color:#fff;display:grid;place-items:center;box-shadow:0 12px 26px -10px rgba(75,52,112,.7);transition:transform .2s}
.mic svg{width:28px;height:28px}
.mic:active{transform:scale(.95)}
.rec.on{background:var(--rose-s)}
.rec.on .mic{background:#D64550;animation:recpulse 1.4s ease-out infinite}
@keyframes recpulse{0%{box-shadow:0 0 0 0 rgba(214,69,80,.5)}100%{box-shadow:0 0 0 16px rgba(214,69,80,0)}}
.rec.done{background:var(--leaf-s)}
.rec.done .mic{background:var(--leaf)}
#tbody{width:100%;border:1.5px solid var(--line2);border-radius:16px;padding:12px 14px;font-size:15px;resize:vertical;outline:none;background:#fff}
#tbody:focus{border-color:var(--bloom);box-shadow:0 0 0 4px var(--bloom-s)}
#tsend{justify-content:center}
#pane-tell h4{margin:10px 0 0;font:700 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.note{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;font-size:14px;margin-top:8px}
.note.st-new{border-left:4px solid var(--bloom)}
.note .nh{display:flex;align-items:center;gap:8px}
.note .nh .av{width:24px;height:24px;font-size:10px}
.note .nh .pill{margin:0 0 0 auto}
.note p{white-space:pre-wrap}
.note audio{width:100%;height:36px}
.note .pn{display:flex;gap:6px;font-size:13px;color:var(--leaf);font-weight:600}
.note .pn svg{width:15px;height:15px;flex:none;margin-top:2px}
.nact{display:flex;gap:6px;flex-wrap:wrap}
.nact:empty{display:none}
.ghost.ndel{margin-left:auto;color:#B4475A}
.ghost svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}

.gate .linkish{border:0;background:none;color:var(--bloom);font-weight:700;margin-top:10px;text-decoration:underline;text-underline-offset:3px}

/* soul blueprint */
.cchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.cchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px 3px 4px;border-radius:99px;background:color-mix(in srgb,var(--cc) 13%,#fff);color:color-mix(in srgb,var(--cc) 80%,#000);border:1px solid color-mix(in srgb,var(--cc) 28%,transparent);white-space:nowrap}
.cchip .num{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--cc);color:#fff;font-size:10.5px}
.cchip.grp{--cc:#5B5470;padding-left:9px}
.cchip.grp svg{width:13px;height:13px}
.bpduo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px;align-items:stretch}
#wheel{width:100%;height:auto;display:block;max-width:460px;margin:0 auto;overflow:visible}
#wheel .wedge{cursor:pointer;transition:opacity .35s,transform .45s cubic-bezier(.3,1.3,.5,1);transform-origin:200px 200px}
#wheel .wedge:hover,#wheel .wedge.sel{transform:scale(1.035)}
#wheel .wedge.dim{opacity:.28}
#wheel .wedge:focus-visible{outline:none}
#wheel .wedge:focus-visible path{stroke:var(--ink);stroke-width:2.5}
#wheel .wl{font:700 12.5px var(--sans);fill:var(--muted);pointer-events:none}
#wheel .wn{font:600 16px var(--serif);pointer-events:none}
#wheel .pin{pointer-events:none}
#wheel .hub{font:400 15px var(--serif);fill:var(--ink)}
#wheel .hubs{font:700 10px var(--sans);letter-spacing:.14em;fill:var(--faint)}
.cdetail{display:flex;flex-direction:column;gap:12px}
.cdetail .chd{display:flex;align-items:center;gap:12px}
.cdetail .cic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 16%,#fff);color:var(--cc);flex:none;box-shadow:0 10px 26px -12px var(--cc)}
.cdetail .cic svg{width:26px;height:26px}
.cdetail .cnum{font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--cc)}
.cdetail h3{font-size:24px}
.cdetail .blk{border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.cdetail .blk b{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.cdetail .gift{background:color-mix(in srgb,var(--cc) 9%,#fff);border:1px solid color-mix(in srgb,var(--cc) 22%,transparent)}
.cdetail .gift b{color:var(--cc)}
.cdetail .watch{background:var(--paper2);border:1px solid var(--line)}
.cdetail .watch b{color:var(--muted)}
.carriers{display:flex;flex-wrap:wrap;gap:8px}
.carrier{display:flex;align-items:center;gap:8px;background:var(--glass2);border:1px solid var(--line);border-radius:99px;padding:3px 12px 3px 3px;font-size:13px;font-weight:600}
.carrier small{color:var(--faint);font-weight:600}
.overview{display:grid;gap:8px}
.ovrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:0;background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;transition:transform .25s,box-shadow .25s}
.ovrow:hover{transform:translateY(-2px);box-shadow:var(--sh1)}
.ovrow .nm{font:600 17px var(--serif);min-width:74px}
.gapnote{margin-top:16px;display:grid;grid-template-columns:auto 1fr 1fr;gap:20px;align-items:start;background:linear-gradient(140deg,rgba(255,255,255,.85),var(--bloom-s))}
.gapnote .gi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--bloom);color:#fff}
.gapnote .gi svg{width:22px;height:22px}
.gapnote h3{font-size:18px;margin-bottom:6px}
.gapnote p{font-size:14.5px;color:var(--muted)}
.lineup{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:7px}
.lineup li{display:flex;gap:9px;align-items:center;font-size:14px;line-height:1.35}
.lineup .av{width:26px;height:26px;font-size:11px}
.fit{margin-top:14px;display:grid;grid-template-columns:1.05fr .95fr;gap:22px}
.fit .fhd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fit .fhd .av{width:46px;height:46px;font-size:18px}
.fit .fhd b{font:600 24px var(--serif)}
.fit .read{color:var(--muted);font-size:15px;margin-top:12px}
.cmp{display:grid;gap:9px;margin-top:16px}
.cmprow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;font-size:13px;font-weight:600}
.cmpbar{position:relative;height:22px}
.cmpbar .bp{position:absolute;left:0;top:0;height:22px;border-radius:99px;border:2px dashed color-mix(in srgb,var(--c) 65%,transparent);background:color-mix(in srgb,var(--c) 6%,transparent);transition:width .8s cubic-bezier(.3,1,.4,1)}
.cmpbar .now{position:absolute;left:4px;top:6px;height:10px;border-radius:99px;background:var(--c);transition:width .8s cubic-bezier(.3,1,.4,1)}
.cmpkey{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.cmpkey span{display:flex;align-items:center;gap:6px}
.cmpkey i{display:inline-block;width:22px;height:10px;border-radius:99px;background:var(--c)}
.cmpkey i.d{background:transparent;border:2px dashed var(--c);height:12px}
.fitl{display:grid;gap:10px}
.fitl .grp{border-radius:16px;padding:12px 14px;background:var(--glass2);border:1px solid var(--line)}
.fitl .grp b{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--k);margin-bottom:5px}
.fitl .grp b svg{width:15px;height:15px}
.fitl ul{margin:0;padding-left:18px;font-size:14px;line-height:1.45;display:grid;gap:4px}
.fitl .grp.watch{background:var(--paper2)}
.fitl .grp p{font-size:14px;line-height:1.45}
#fitwho .pchip{padding:5px 16px 5px 5px;font-size:14px}
#fitwho .pchip .av{width:34px;height:34px}
/* person sheet */
.sheet{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px}
.sback{position:absolute;inset:0;background:rgba(37,30,49,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
@keyframes popin{from{opacity:0;transform:translateY(24px) scale(.97)}}
.sbox{position:relative;width:min(1040px,100%);max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);display:flex;flex-direction:column;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 9%,#fff),#fff 40%);border:1px solid var(--line);border-radius:28px;box-shadow:0 40px 90px -30px rgba(37,30,49,.55);overflow:hidden;animation:popin .45s cubic-bezier(.3,1.2,.4,1)}
.shead{display:flex;align-items:center;gap:12px;padding:18px 20px 10px}
.shead .av{width:48px;height:48px;font-size:19px;box-shadow:0 10px 24px -10px var(--c)}
.shead b{font:600 26px/1.1 var(--serif)}
.snav{margin-left:auto;display:flex;gap:6px}
.icob{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);display:grid;place-items:center;color:var(--muted)}
.icob:hover{color:var(--ink);box-shadow:var(--sh1)}
.icob svg{width:18px;height:18px}
.spages{display:flex;gap:6px;padding:4px 20px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.spages button{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--glass2);border-radius:99px;padding:8px 16px;font-weight:700;font-size:13.5px;color:var(--muted);transition:all .25s}
.spages button svg{width:16px;height:16px}
.spages button[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 20px -10px var(--c)}
.sbody{padding:20px;overflow-y:auto;scrollbar-width:thin}
.sbody > *{animation:fadein .4s}
.souls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}
.scard{border-radius:20px;padding:18px;background:color-mix(in srgb,var(--cc) 8%,#fff);border:1px solid color-mix(in srgb,var(--cc) 24%,transparent);position:relative;overflow:hidden}
.scard::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;right:-50px;top:-50px;background:radial-gradient(circle,color-mix(in srgb,var(--cc) 30%,transparent),transparent 70%)}
.scard .cic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:var(--cc);color:#fff;box-shadow:0 10px 24px -10px var(--cc)}
.scard .cic svg{width:24px;height:24px}
.scard .k{font:700 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--cc);margin-top:12px}
.scard h4{font:400 24px/1.15 var(--serif);margin:4px 0 8px}
.scard p{font-size:14.5px;color:var(--ink);line-height:1.5}
.scard .wt{margin-top:10px;font-size:13px;color:var(--muted)}
.scard .wt b{color:var(--ink)}
.sread{font:400 19px/1.45 var(--serif);color:var(--ink);max-width:62ch}
.mm{position:relative;display:grid;grid-template-columns:1fr 210px 1fr;gap:28px;align-items:center;min-height:440px;padding:10px 0}
.mm svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mm .col{display:grid;gap:12px;position:relative;z-index:1}
.mm .colh{display:flex;align-items:center;gap:7px;font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.mm .colh svg{width:16px;height:16px}
.mm .shine .colh{color:var(--leaf)}
.mm .avoid .colh{color:var(--rose);justify-content:flex-end}
.node{border-radius:16px;padding:11px 14px;background:#fff;border:1.5px solid var(--nc);box-shadow:var(--sh1);transition:transform .3s cubic-bezier(.3,1.3,.5,1),box-shadow .3s;opacity:0;transform:translateX(var(--from,0));animation:nodein .6s cubic-bezier(.3,1.2,.4,1) forwards;animation-delay:var(--d,0s)}
@keyframes nodein{to{opacity:1;transform:none}}
.node:hover{box-shadow:var(--sh2)}
.node b{display:block;font:600 16px/1.2 var(--serif)}
.node span{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:3px}
.shine .node{--nc:color-mix(in srgb,var(--leaf) 45%,transparent);--from:-18px;background:linear-gradient(120deg,var(--leaf-s),#fff 70%)}
.avoid .node{--nc:color-mix(in srgb,var(--rose) 40%,transparent);--from:18px;background:linear-gradient(240deg,var(--rose-s),#fff 70%);text-align:right}
.hubn{position:relative;z-index:1;display:grid;justify-items:center;gap:10px;text-align:center}
.hubn .orb2{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,color-mix(in srgb,var(--c) 40%,#fff));box-shadow:0 0 0 10px color-mix(in srgb,var(--c) 10%,transparent),0 20px 50px -18px var(--c);font:400 46px var(--serif);color:var(--c);animation:breathe3 5s ease-in-out infinite}
@keyframes breathe3{50%{box-shadow:0 0 0 18px color-mix(in srgb,var(--c) 6%,transparent),0 20px 50px -18px var(--c)}}
.hubn .cchips{justify-content:center;margin-top:0}
.mm .lines path{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.1s ease forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.skgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.skgrid h4{font:600 18px var(--serif);margin:0 0 10px}
.nownote{margin-top:18px;display:flex;gap:12px;align-items:flex-start;border-radius:18px;padding:14px 16px;background:var(--sun-s);border:1px solid color-mix(in srgb,var(--sun) 35%,transparent)}
.nownote svg{width:22px;height:22px;color:var(--sun);flex:none;margin-top:2px}
.nownote b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sun);margin-bottom:2px}
.nownote p{font-size:14.5px}
.skl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.skl li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14px;padding:8px 12px;border-radius:12px;background:var(--glass2);border:1px solid var(--line)}
.skl .lv i.on{background:var(--c)}
.pairs{margin-top:14px;display:grid;gap:8px}
.pair{display:flex;gap:10px;align-items:center;font-size:13.5px;padding:9px 12px;border-radius:12px;border:1px dashed var(--line2)}
.pair svg{width:16px;height:16px;flex:none}
